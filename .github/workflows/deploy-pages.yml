name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full git history for CreatedModifiedDate plugin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./site
        run: npm ci

      - name: Validate reading digests
        run: |
          node --test scripts/reading-digest.test.mjs
          node scripts/reading-digest.mjs --check

      - name: Test local notification helper
        run: node --test scripts/notify-reading.test.mjs

      - name: Test reading RSS
        working-directory: ./site
        run: node --import tsx --test quartz/plugins/emitters/readingFeed.test.ts

      - name: Build Quartz
        working-directory: ./site
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
