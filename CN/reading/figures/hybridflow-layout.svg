<svg xmlns="http://www.w3.org/2000/svg" width="780" height="2540" viewBox="0 0 390 1270" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">四张卡，两种权重布局</title><desc id="desc">简化示意 · 一个训练 DP 副本. PP = 1 · 不包含 KV cache / 优化器. Training: G1=A, G2=B, G3=C, G4=D. All-gather: [G1,G2], [G3,G4]. Generation replicas: [G1(AB),G3(CD)] and [G2(AB),G4(CD)]. A/B/C/D denote conceptual parameter shards, not literal tensor storage order.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#738297" stroke-width="1.3"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;fill:#1c2e45} .muted{fill:#52647a}</style>
<rect x="0" y="0" width="390" height="1270" rx="0" fill="#f8fafc" stroke="none" />
<text x="20" y="28" font-size="12" font-weight="700" text-anchor="start" class="muted">HYBRIDFLOW · EUROSYS 2025</text>
<text x="20" y="66" font-size="24" font-weight="700" text-anchor="start" class="">四张卡，两种权重布局</text>
<text x="20" y="96" font-size="14" font-weight="500" text-anchor="start" class="muted">简化示意 · 一个训练 DP 副本</text>
<text x="20" y="118" font-size="13.5" font-weight="400" text-anchor="start" class="muted">PP = 1 · 不包含 KV cache / 优化器</text>
<line x1="20" y1="140" x2="370" y2="140" stroke="#c9d3df" stroke-width="1.2" />
<circle cx="31" cy="170" r="12" fill="#233b59"/>
<text x="31" y="175" font-size="13" font-weight="700" text-anchor="middle" style="fill:white">1</text>
<text x="52" y="176" font-size="18" font-weight="700" text-anchor="start" class="">训练：1 个副本，TP = 4</text>
<text x="20" y="202" font-size="13.3" font-weight="400" text-anchor="start" class="muted">A、B、C、D 表示同一模型的四份训练分片。</text>
<rect x="20" y="224" width="80" height="106" rx="12" fill="#ffffff" stroke="#dbe3ed" />
<text x="60" y="251" font-size="16" font-weight="700" text-anchor="middle" class="">G1</text>
<rect x="32" y="269" width="56" height="43" rx="7" fill="#e5edff" stroke="#2358ad" stroke-width="2.5"/>
<text x="60" y="296.5" font-size="21" font-weight="700" text-anchor="middle" class="">A</text>
<rect x="110" y="224" width="80" height="106" rx="12" fill="#ffffff" stroke="#dbe3ed" />
<text x="150" y="251" font-size="16" font-weight="700" text-anchor="middle" class="">G2</text>
<rect x="122" y="269" width="56" height="43" rx="7" fill="#def4ee" stroke="#14715c" stroke-width="2.5"/>
<text x="150" y="296.5" font-size="21" font-weight="700" text-anchor="middle" class="">B</text>
<rect x="200" y="224" width="80" height="106" rx="12" fill="#ffffff" stroke="#dbe3ed" />
<text x="240" y="251" font-size="16" font-weight="700" text-anchor="middle" class="">G3</text>
<rect x="212" y="269" width="56" height="43" rx="7" fill="#fff0dc" stroke="#a95a12" stroke-width="2.5"/>
<text x="240" y="296.5" font-size="21" font-weight="700" text-anchor="middle" class="">C</text>
<rect x="290" y="224" width="80" height="106" rx="12" fill="#ffffff" stroke="#dbe3ed" />
<text x="330" y="251" font-size="16" font-weight="700" text-anchor="middle" class="">G4</text>
<rect x="302" y="269" width="56" height="43" rx="7" fill="#eee6fa" stroke="#7443a7" stroke-width="2.5"/>
<text x="330" y="296.5" font-size="21" font-weight="700" text-anchor="middle" class="">D</text>
<path d="M26 341 V350 H364 V341" fill="none" stroke="#738297" stroke-width="1.5"/>
<text x="195" y="376" font-size="14" font-weight="600" text-anchor="middle" class="">训练 TP 组 [G1, G2, G3, G4]</text>
<line x1="195" y1="395" x2="195" y2="425" stroke="#738297" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="31" cy="458" r="12" fill="#233b59"/>
<text x="31" y="463" font-size="13" font-weight="700" text-anchor="middle" style="fill:white">2</text>
<text x="52" y="464" font-size="18" font-weight="700" text-anchor="start" class="">换布局：只补齐所需权重</text>
<text x="20" y="489" font-size="13.1" font-weight="400" text-anchor="start" class="muted">两组 all-gather（论文中的 micro-DP 组）</text>
<rect x="20" y="506" width="350" height="116" rx="12" fill="#ffffff" stroke="#dbe3ed" />
<text x="36" y="531" font-size="15" font-weight="700" text-anchor="start" class="">[G1, G2] · all-gather</text>
<text x="55" y="571" font-size="15" font-weight="700" text-anchor="middle" class="">G1</text>
<text x="335" y="571" font-size="15" font-weight="700" text-anchor="middle" class="">G2</text>
<line x1="86" y1="558" x2="304" y2="558" stroke="#2358ad" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="304" y1="581" x2="86" y2="581" stroke="#14715c" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="179" y="544" width="32" height="25" rx="5" fill="#e5edff" stroke="none" />
<text x="195" y="562" font-size="16" font-weight="700" text-anchor="middle" class="">A</text>
<rect x="179" y="570" width="32" height="25" rx="5" fill="#def4ee" stroke="none" />
<text x="195" y="588" font-size="16" font-weight="700" text-anchor="middle" class="">B</text>
<text x="195" y="610" font-size="12.9" font-weight="400" text-anchor="middle" class="muted">G1 保留 A，接收 B；G2 保留 B，接收 A。</text>
<rect x="20" y="634" width="350" height="116" rx="12" fill="#ffffff" stroke="#dbe3ed" />
<text x="36" y="659" font-size="15" font-weight="700" text-anchor="start" class="">[G3, G4] · all-gather</text>
<text x="55" y="699" font-size="15" font-weight="700" text-anchor="middle" class="">G3</text>
<text x="335" y="699" font-size="15" font-weight="700" text-anchor="middle" class="">G4</text>
<line x1="86" y1="686" x2="304" y2="686" stroke="#a95a12" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="304" y1="709" x2="86" y2="709" stroke="#7443a7" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="179" y="672" width="32" height="25" rx="5" fill="#fff0dc" stroke="none" />
<text x="195" y="690" font-size="16" font-weight="700" text-anchor="middle" class="">C</text>
<rect x="179" y="698" width="32" height="25" rx="5" fill="#eee6fa" stroke="none" />
<text x="195" y="716" font-size="16" font-weight="700" text-anchor="middle" class="">D</text>
<text x="195" y="738" font-size="12.9" font-weight="400" text-anchor="middle" class="muted">G3 保留 C，接收 D；G4 保留 D，接收 C。</text>
<line x1="195" y1="766" x2="195" y2="796" stroke="#738297" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="31" cy="828" r="12" fill="#233b59"/>
<text x="31" y="833" font-size="13" font-weight="700" text-anchor="middle" style="fill:white">3</text>
<text x="52" y="834" font-size="18" font-weight="700" text-anchor="start" class="">生成：2 个副本，各自 TP = 2</text>
<text x="20" y="859" font-size="12.6" font-weight="400" text-anchor="start" class="muted">实线：保留的本地分片   虚线：接收的分片</text>
<rect x="20" y="877" width="350" height="132" rx="12" fill="#eaf0f8" stroke="#c8d6e6" />
<text x="36" y="903" font-size="15" font-weight="700" text-anchor="start" class="">生成副本 1 · TP 组 [G1, G3]</text>
<rect x="34" y="916" width="154" height="79" rx="9" fill="#ffffff" stroke="#dbe3ed" />
<text x="111" y="937" font-size="15" font-weight="700" text-anchor="middle" class="">G1</text>
<rect x="50" y="945" width="54" height="38" rx="7" fill="#e5edff" stroke="#2358ad" stroke-width="2.5"/>
<text x="77" y="970" font-size="21" font-weight="700" text-anchor="middle" class="">A</text>
<rect x="118" y="945" width="54" height="38" rx="7" fill="#def4ee" stroke="#14715c" stroke-width="1.7" stroke-dasharray="4 3"/>
<text x="145" y="970" font-size="21" font-weight="700" text-anchor="middle" class="">B</text>
<rect x="202" y="916" width="154" height="79" rx="9" fill="#ffffff" stroke="#dbe3ed" />
<text x="279" y="937" font-size="15" font-weight="700" text-anchor="middle" class="">G3</text>
<rect x="218" y="945" width="54" height="38" rx="7" fill="#fff0dc" stroke="#a95a12" stroke-width="2.5"/>
<text x="245" y="970" font-size="21" font-weight="700" text-anchor="middle" class="">C</text>
<rect x="286" y="945" width="54" height="38" rx="7" fill="#eee6fa" stroke="#7443a7" stroke-width="1.7" stroke-dasharray="4 3"/>
<text x="313" y="970" font-size="21" font-weight="700" text-anchor="middle" class="">D</text>
<rect x="20" y="1023" width="350" height="132" rx="12" fill="#eaf0f8" stroke="#c8d6e6" />
<text x="36" y="1049" font-size="15" font-weight="700" text-anchor="start" class="">生成副本 2 · TP 组 [G2, G4]</text>
<rect x="34" y="1062" width="154" height="79" rx="9" fill="#ffffff" stroke="#dbe3ed" />
<text x="111" y="1083" font-size="15" font-weight="700" text-anchor="middle" class="">G2</text>
<rect x="50" y="1091" width="54" height="38" rx="7" fill="#e5edff" stroke="#2358ad" stroke-width="1.7" stroke-dasharray="4 3"/>
<text x="77" y="1116" font-size="21" font-weight="700" text-anchor="middle" class="">A</text>
<rect x="118" y="1091" width="54" height="38" rx="7" fill="#def4ee" stroke="#14715c" stroke-width="2.5"/>
<text x="145" y="1116" font-size="21" font-weight="700" text-anchor="middle" class="">B</text>
<rect x="202" y="1062" width="154" height="79" rx="9" fill="#ffffff" stroke="#dbe3ed" />
<text x="279" y="1083" font-size="15" font-weight="700" text-anchor="middle" class="">G4</text>
<rect x="218" y="1091" width="54" height="38" rx="7" fill="#fff0dc" stroke="#a95a12" stroke-width="1.7" stroke-dasharray="4 3"/>
<text x="245" y="1116" font-size="21" font-weight="700" text-anchor="middle" class="">C</text>
<rect x="286" y="1091" width="54" height="38" rx="7" fill="#eee6fa" stroke="#7443a7" stroke-width="2.5"/>
<text x="313" y="1116" font-size="21" font-weight="700" text-anchor="middle" class="">D</text>
<text x="20" y="1184" font-size="13.5" font-weight="600" text-anchor="start" class="">每个生成副本都拥有完整的 A + B + C + D。</text>
<text x="20" y="1206" font-size="13.5" font-weight="400" text-anchor="start" class="muted">每张卡原有的训练分片仍在本地。</text>
<line x1="20" y1="1224" x2="370" y2="1224" stroke="#c9d3df" stroke-width="1.2" />
<a href="https://i.cs.hku.hk/~cwu/papers/gmsheng-eurosys25.pdf#page=8">
<text x="20" y="1246" font-size="12" font-weight="400" text-anchor="start" class="muted">原创简化示意，依据论文 §5.3 / Fig. 8(b)</text>
</a></svg>